[project]
name = "acp-imobiliar"
version = "0.1.0"
description = "Analiză Comparativă de Piață pentru anunțuri imobiliare"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "jinja2>=3.1",
    "weasyprint>=61",
    "beautifulsoup4>=4.12",
    "httpx>=0.25",
    "requests-cache>=1.1",
    "playwright>=1.40",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
